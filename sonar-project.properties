# SonarQube analysis scope for this repository.
#
# Connection settings (project key, organization, host) are passed by
# .github/workflows/sonarqube.yml from repository variables so this file stays
# the same for SonarQube Cloud and self-hosted SonarQube Server.

sonar.projectName=OpenClaw
sonar.sourceEncoding=UTF-8

# Index the whole repository, then carve tests and generated/vendored paths out.
sonar.sources=.
sonar.tests=.

# Test files live beside their sources. Sonar refuses to index a file as both a
# source and a test, so every test pattern appears here and in sonar.exclusions.
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.mts,\
  **/*.test.js,\
  **/*.test.mjs,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.e2e.ts,\
  **/*.test-support.ts,\
  **/*.test-helpers.ts,\
  **/*.test-utils.ts,\
  **/__tests__/**,\
  test/**

sonar.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.mts,\
  **/*.test.js,\
  **/*.test.mjs,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.e2e.ts,\
  **/*.test-support.ts,\
  **/*.test-helpers.ts,\
  **/*.test-utils.ts,\
  **/__tests__/**,\
  test/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/dist-runtime/**,\
  **/dist-sea/**,\
  **/build/**,\
  **/.cache/**,\
  **/.artifacts/**,\
  **/coverage/**,\
  **/*.d.ts,\
  **/*.min.js,\
  **/*.bundle.js,\
  **/*.map,\
  **/*.snap,\
  **/__snapshots__/**,\
  **/__screenshots__/**,\
  **/fixtures/**,\
  **/__fixtures__/**,\
  **/*.fixture.*,\
  **/*-fixture.*,\
  **/*-fixtures.*,\
  **/*.mock.*,\
  **/*-mock.*,\
  **/*-mocks.*,\
  docs/**,\
  CHANGELOG/**,\
  patches/**,\
  vendor/**,\
  **/vendor/**,\
  ui/src/i18n/.i18n/**,\
  apps/**/autogenerated/**,\
  apps/**/*.generated.*,\
  crates/**/target/**,\
  pnpm-lock.yaml,\
  **/pnpm-lock.yaml,\
  **/package-lock.json,\
  **/*.lock

# Mirrors the vitest unit coverage exclude list in test/vitest/vitest.shared.config.ts.
# Files outside the lcov report would otherwise count as 0% covered.
sonar.coverage.exclusions=\
  apps/**,\
  extensions/**,\
  ui/**,\
  scripts/**,\
  skills/**,\
  qa/**,\
  security/**,\
  deploy/**,\
  examples/**,\
  packages/gateway-protocol/src/**,\
  src/entry.ts,\
  src/index.ts,\
  src/runtime.ts,\
  src/logging.ts,\
  src/cli/**,\
  src/commands/**,\
  src/daemon/**,\
  src/hooks/**,\
  src/macos/**,\
  src/acp/**,\
  src/agents/**,\
  src/channels/**,\
  src/gateway/**,\
  src/line/**,\
  src/media-understanding/**,\
  src/node-host/**,\
  src/plugins/**,\
  src/providers/**,\
  src/secrets/**,\
  src/tui/**,\
  src/wizard/**,\
  src/browser/**,\
  src/webchat/**,\
  src/process/exec.ts,\
  src/infra/update-check.ts,\
  src/infra/ports-inspect.ts,\
  src/infra/tailscale.ts,\
  src/infra/outbound/outbound-session.ts

# Test-side scope: keep vendored and generated trees out of the test set too.
sonar.test.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/__snapshots__/**,\
  **/__screenshots__/**,\
  **/fixtures/**,\
  **/__fixtures__/**

# One program per tsconfig keeps the analyzer's TypeScript memory bounded; the
# root tsconfig.json would load all 40k+ files into a single program.
sonar.typescript.tsconfigPaths=\
  tsconfig.core.json,\
  tsconfig.extensions.json,\
  tsconfig.ui.json,\
  tsconfig.scripts.json

# Written by `pnpm test:coverage` when the workflow runs with coverage enabled.
# The scanner only warns when the report is absent.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The TypeScript analyzer runs in its own Node process; the repository has
# roughly 22k first-party source files plus 19k test files.
sonar.javascript.node.maxspace=8192
